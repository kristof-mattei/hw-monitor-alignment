[package]
name = "hw-monitor-alignment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
include.workspace = true
build = "src/build.rs"

[features]
default = []
# Stage a private Windows App SDK runtime next to the executable.
self-contained = ["dep:windows-reactor-setup"]

[dependencies]
hashbrown = "=0.17.1"
windows = { git = "https://github.com/microsoft/windows-rs", rev = "a38689a8b29520db84e3d398e4389d48f18e6346", features = [
    "errhandlingapi",
    "libloaderapi",
    "minwindef",
    "windef",
    "winerror",
    "wingdi",
    "winuser",
] }
windows-core = { git = "https://github.com/microsoft/windows-rs", rev = "a38689a8b29520db84e3d398e4389d48f18e6346" }
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "a38689a8b29520db84e3d398e4389d48f18e6346" }

[build-dependencies]
windows-bindgen = { git = "https://github.com/microsoft/windows-rs", rev = "a38689a8b29520db84e3d398e4389d48f18e6346" }
windows-rdl = { git = "https://github.com/microsoft/windows-rs", rev = "a38689a8b29520db84e3d398e4389d48f18e6346" }
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "a38689a8b29520db84e3d398e4389d48f18e6346", optional = true }

[dev-dependencies]
pretty_assertions = "=1.4.1"

[lints]
workspace = true
